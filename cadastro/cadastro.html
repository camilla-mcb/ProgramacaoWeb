<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patas & Cia | Pet Shop</title>
    <link rel="stylesheet" href="login.css">
    <script src="cadastro.js"></script>
</head>

<body>

    <header>
        <div class="logo">
            <h1>Patas & Cia</h1>
            <p>Carinho e cuidado para seu melhor amigo</p>
        </div>
    </header>

    <div class="containerPai">
        <div class="formulario">
            <h1>Cadastrar-se</h1>
            <form>
                <input type="text" placeholder="Nome" required id="nome">
                <input type="email" placeholder="E-mail" required id="email">
                <input type="password" placeholder="Senha" required id="senha">

                <div class="botao">
                    <input type="submit" value="Confirmar" onclick="cadastrar()">
                    <input type="reset" value="Cancelar">
                </div>

            </form>


        </div>
    </div>



</body>

</html>
