<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patas & Cia | Pet Shop</title>
    <link rel="stylesheet" href="cadastro.css">
    <script src="cadastro.js"></script>
</head>

<body>

    <header>
        <div class="logo">
            <h1>Patas & Cia</h1>
            <p>Carinho e cuidado para seu melhor amigo</p>
        </div>
    </header>

    <div class="containerPai">
        <div class="formulario">
            <h1>Cadastrar-se</h1>
            <form onsubmit="validar(event)"> 
                <input type="text" placeholder="Nome" required id="nome" class="msg">
                <input type="email" placeholder="E-mail"  id="email" class="msg">
                <input type="password" placeholder="Senha"  id="senha" class="msg">

                <div class="botao">
                    <input type="submit" value="Confirmar">
                    <input type="reset" value="Cancelar">
                </div>

                <p id="msg"></p>

            </form>

        </div>
    </div>



</body>

</html>
