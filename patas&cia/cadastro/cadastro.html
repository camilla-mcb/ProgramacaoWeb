<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patas & Cia | Pet Shop</title>
    <link rel="stylesheet" href="../style/cadastro.css">

</head>

<body>

    <header>
        <div class="logo">
            <h1>Patas & Cia</h1>
            <p>Carinho e cuidado para seu melhor amigo</p>
        </div>
    </header>

    <div class="containerPai">
        <div class="formulario">

            <h1>Cadastrar-se</h1>

            <form id="form-cad">
                <input type="text" placeholder="Nome" id="nome" class="msg" required>
                <input type="email" placeholder="E-mail" id="email" class="msg" required>
                <input type="password" placeholder="Senha" id="senha" class="msg" required>

                <div class="botao">
                    <input type="submit" value="Confirmar">
                    <input type="reset" value="Cancelar">
                </div>

            </form>

        </div>

        <p id="msg"></p>
        <p id="msgFoi"></p>
        <p id="msgErro"></p>

    </div>

    <script src="cadastro.js" defer></script>

</body>

</html>
